<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">Draft and target next-token probability distributions</title>
  <desc id="desc">Paired horizontal bars compare draft and target probabilities for Santa, Austin, Seattle, and Boston. The draft assigns Santa 60 percent while the target assigns 45 percent.</desc>
  <rect x="1" y="1" width="1098" height="568" rx="22" fill="#fffaf8" stroke="#cbbaff" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
    <text x="550" y="48" text-anchor="middle" font-size="27" font-weight="650" fill="#1d1d1f">Two models, two probability distributions</text>
    <text x="550" y="78" text-anchor="middle" font-size="16" fill="#6e6e73">Next token after “NVIDIA is headquartered in” · simplified four-token vocabulary</text>
    <rect x="700" y="105" width="18" height="12" rx="3" fill="#70b990"/><text x="726" y="116" font-size="13" fill="#4d4755">Draft q</text><rect x="810" y="105" width="18" height="12" rx="3" fill="#7da8e8"/><text x="836" y="116" font-size="13" fill="#4d4755">Target p</text>
    <g font-size="16" font-weight="650" fill="#25212d"><text x="75" y="179">Santa</text><text x="75" y="273">Austin</text><text x="75" y="367">Seattle</text><text x="75" y="461">Boston</text></g>
    <g stroke="#e7e0ee"><line x1="205" y1="140" x2="985" y2="140"/><line x1="205" y1="234" x2="985" y2="234"/><line x1="205" y1="328" x2="985" y2="328"/><line x1="205" y1="422" x2="985" y2="422"/><line x1="205" y1="516" x2="985" y2="516"/></g>
    <g fill="#70b990"><rect x="205" y="156" width="660" height="25" rx="6"/><rect x="205" y="250" width="110" height="25" rx="6"/><rect x="205" y="344" width="110" height="25" rx="6"/><rect x="205" y="438" width="220" height="25" rx="6"/></g>
    <g fill="#7da8e8"><rect x="205" y="187" width="495" height="25" rx="6"/><rect x="205" y="281" width="275" height="25" rx="6"/><rect x="205" y="375" width="220" height="25" rx="6"/><rect x="205" y="469" width="110" height="25" rx="6"/></g>
    <g font-size="14" font-weight="650"><text x="878" y="175" fill="#27543b">60%</text><text x="713" y="206" fill="#294563">45%</text><text x="328" y="269" fill="#27543b">10%</text><text x="493" y="300" fill="#294563">25%</text><text x="328" y="363" fill="#27543b">10%</text><text x="438" y="394" fill="#294563">20%</text><text x="438" y="457" fill="#27543b">20%</text><text x="328" y="488" fill="#294563">10%</text></g>
    <g font-size="12" fill="#827a89"><text x="205" y="538">0%</text><text x="480" y="538">25%</text><text x="755" y="538">50%</text><text x="975" y="538">70%</text></g>
    <line x1="205" y1="523" x2="975" y2="523" stroke="#a69eae"/>
  </g>
</svg>
