<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek-style multi-token prediction training and combined loss</title>
  <desc id="desc">The main Transformer predicts token t plus 1 with the standard next-token loss. MTP depth 1 combines the main hidden state with the true token t plus 1 embedding and predicts t plus 2. MTP depth 2 repeats the process with the true token t plus 2 embedding and predicts t plus 3. All paths share embeddings and the output head. The scaled average MTP losses are added to the next-token loss.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#625b75"/></marker></defs>
  <rect x="1" y="1" width="1198" height="648" rx="22" fill="#fffaf8" stroke="#cbbaff" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
    <text x="600" y="46" text-anchor="middle" font-size="27" font-weight="650" fill="#1d1d1f">MTP adds farther-looking training signals</text>
    <text x="600" y="75" text-anchor="middle" font-size="15" fill="#6e6e73">DeepSeek-V3 / Megatron-style sequential chain at one training position</text>

    <g text-anchor="middle">
      <rect x="42" y="112" width="330" height="355" rx="18" fill="#faf9ff" stroke="#cbbaff"/>
      <rect x="435" y="112" width="330" height="355" rx="18" fill="#fbfdfb" stroke="#cbbaff"/>
      <rect x="828" y="112" width="330" height="355" rx="18" fill="#fbfdfb" stroke="#cbbaff"/>
      <text x="207" y="145" font-size="14" font-weight="700" fill="#6e56cf">MAIN MODEL</text>
      <text x="600" y="145" font-size="14" font-weight="700" fill="#6e56cf">MTP DEPTH 1</text>
      <text x="993" y="145" font-size="14" font-weight="700" fill="#6e56cf">MTP DEPTH 2</text>

      <rect x="97" y="177" width="220" height="55" rx="11" fill="#f2edff" stroke="#b6a3f4"/><text x="207" y="211" font-size="15" font-weight="650" fill="#25212d">Context through token t</text>
      <rect x="97" y="263" width="220" height="70" rx="13" fill="#eaf2ff" stroke="#8eb3eb"/><text x="207" y="291" font-size="16" font-weight="650" fill="#25212d">Main Transformer</text><text x="207" y="315" font-size="13" fill="#526273">produces hidden state h</text>
      <rect x="97" y="364" width="220" height="55" rx="11" fill="#eaf8f0" stroke="#72bd93"/><text x="207" y="398" font-size="15" font-weight="650" fill="#27543b">Shared output head</text>

      <rect x="470" y="177" width="115" height="55" rx="11" fill="#f2edff" stroke="#b6a3f4"/><text x="527" y="198" font-size="12" fill="#655f6d">shared embed</text><text x="527" y="218" font-size="15" font-weight="650" fill="#25212d">true t+1</text>
      <rect x="615" y="177" width="115" height="55" rx="11" fill="#f2edff" stroke="#b6a3f4"/><text x="672" y="198" font-size="13" fill="#655f6d">main state</text><text x="672" y="218" font-size="15" font-weight="650" fill="#25212d">h</text>
      <rect x="490" y="263" width="220" height="70" rx="13" fill="#fff4d8" stroke="#dbb968"/><text x="600" y="291" font-size="16" font-weight="650" fill="#25212d">Project + MTP block</text><text x="600" y="315" font-size="13" fill="#6c5b32">produces state h¹</text>
      <rect x="490" y="364" width="220" height="55" rx="11" fill="#eaf8f0" stroke="#72bd93"/><text x="600" y="398" font-size="15" font-weight="650" fill="#27543b">Shared output head</text>

      <rect x="863" y="177" width="115" height="55" rx="11" fill="#f2edff" stroke="#b6a3f4"/><text x="920" y="198" font-size="12" fill="#655f6d">shared embed</text><text x="920" y="218" font-size="15" font-weight="650" fill="#25212d">true t+2</text>
      <rect x="1008" y="177" width="115" height="55" rx="11" fill="#f2edff" stroke="#b6a3f4"/><text x="1065" y="198" font-size="13" fill="#655f6d">prior state</text><text x="1065" y="218" font-size="15" font-weight="650" fill="#25212d">h¹</text>
      <rect x="883" y="263" width="220" height="70" rx="13" fill="#fff4d8" stroke="#dbb968"/><text x="993" y="291" font-size="16" font-weight="650" fill="#25212d">Project + MTP block</text><text x="993" y="315" font-size="13" fill="#6c5b32">produces state h²</text>
      <rect x="883" y="364" width="220" height="55" rx="11" fill="#eaf8f0" stroke="#72bd93"/><text x="993" y="398" font-size="15" font-weight="650" fill="#27543b">Shared output head</text>
    </g>

    <g fill="none" stroke="#625b75" stroke-width="1.8" marker-end="url(#a)">
      <path d="M207 232v31"/><path d="M207 333v31"/>
      <path d="M527 232v22c0 9 18 9 45 9"/><path d="M672 232v22c0 9-18 9-44 9"/><path d="M600 333v31"/>
      <path d="M920 232v22c0 9 18 9 45 9"/><path d="M1065 232v22c0 9-18 9-44 9"/><path d="M993 333v31"/>
    </g>
    <path d="M317 298h107c27 0 42-18 42-44" fill="none" stroke="#6e56cf" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <path d="M710 298h107c27 0 42-18 42-44" fill="none" stroke="#6e56cf" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <text x="394" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="#6e56cf">PASS h</text>
    <text x="787" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="#6e56cf">PASS h¹</text>

    <g text-anchor="middle">
      <rect x="75" y="438" width="264" height="43" rx="10" fill="#fff1ec" stroke="#e59b76"/><text x="207" y="466" font-size="14" font-weight="650" fill="#743e2e">Lnext · predict t+1</text>
      <rect x="468" y="438" width="264" height="43" rx="10" fill="#fff1ec" stroke="#e59b76"/><text x="600" y="466" font-size="14" font-weight="650" fill="#743e2e">LMTP¹ · predict t+2</text>
      <rect x="861" y="438" width="264" height="43" rx="10" fill="#fff1ec" stroke="#e59b76"/><text x="993" y="466" font-size="14" font-weight="650" fill="#743e2e">LMTP² · predict t+3</text>
    </g>
    <g fill="none" stroke="#625b75" stroke-width="1.6" marker-end="url(#a)"><path d="M207 419v19"/><path d="M600 419v19"/><path d="M993 419v19"/></g>

    <rect x="185" y="529" width="830" height="66" rx="16" fill="#f2edff" stroke="#b6a3f4" stroke-width="2"/>
    <text x="600" y="557" text-anchor="middle" font-size="17" font-weight="700" fill="#352a61">Ltotal = Lnext + λ × average(LMTP¹, LMTP², …)</text>
    <text x="600" y="581" text-anchor="middle" font-size="13" fill="#655f6d">λ keeps the auxiliary future-token objectives smaller than the primary next-token objective.</text>
    <text x="600" y="625" text-anchor="middle" font-size="13" fill="#6e6e73">Ground-truth future embeddings are available during training; deployed drafting must roll forward from generated tokens.</text>
  </g>
</svg>
