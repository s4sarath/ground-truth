<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Rejection, correction, and redrafting loop</title>
  <desc id="desc">The target and draft probabilities produce a 75 percent acceptance probability for Santa. A Bernoulli rejection leads to target minus draft subtraction, negative values are clipped, Austin is sampled from the normalized remainder, the old draft suffix is discarded, and drafting restarts from Austin.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#625b75"/></marker></defs>
  <rect x="1" y="1" width="1198" height="618" rx="22" fill="#fffaf8" stroke="#cbbaff" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
    <text x="600" y="48" text-anchor="middle" font-size="27" font-weight="650" fill="#1d1d1f">Reject once, correct once, then draft from reality</text>
    <text x="600" y="78" text-anchor="middle" font-size="16" fill="#6e6e73">Example for the proposed token “Santa”</text>
    <g text-anchor="middle">
      <rect x="45" y="120" width="205" height="88" rx="14" fill="#f2edff" stroke="#b6a3f4"/><text x="147" y="151" font-size="15" font-weight="650" fill="#25212d">Compare probabilities</text><text x="147" y="177" font-size="14" fill="#655f6d">p = 45% · q = 60%</text><text x="147" y="197" font-size="14" font-weight="650" fill="#6e56cf">accept = 75%</text>
      <rect x="315" y="120" width="205" height="88" rx="14" fill="#fff1ec" stroke="#e59b76"/><text x="417" y="151" font-size="15" font-weight="650" fill="#25212d">Bernoulli draw</text><text x="417" y="177" font-size="14" fill="#6f4c40">draw = 0.84</text><text x="417" y="197" font-size="14" font-weight="700" fill="#c14f35">REJECT</text>
      <rect x="585" y="120" width="250" height="88" rx="14" fill="#faf9ff" stroke="#b6a3f4"/><text x="710" y="151" font-size="15" font-weight="650" fill="#25212d">Subtract full distributions</text><text x="710" y="177" font-size="14" fill="#655f6d">target p − draft q</text><text x="710" y="197" font-size="14" fill="#655f6d">clip every negative value to 0</text>
      <rect x="900" y="120" width="255" height="88" rx="14" fill="#eaf2ff" stroke="#8eb3eb"/><text x="1027" y="151" font-size="15" font-weight="650" fill="#25212d">Correction distribution</text><text x="1027" y="177" font-size="14" fill="#526273">Austin 60% · Seattle 40%</text><text x="1027" y="197" font-size="14" font-weight="700" fill="#294563">sample Austin</text>
    </g>
    <g fill="none" stroke="#625b75" stroke-width="2" marker-end="url(#a)"><path d="M250 164h65"/><path d="M520 164h65"/><path d="M835 164h65"/></g>
    <line x1="45" y1="250" x2="1155" y2="250" stroke="#e4dbff"/>
    <text x="45" y="292" font-size="13" font-weight="700" fill="#6e56cf">WHAT HAPPENS TO THE SEQUENCE</text>
    <g text-anchor="middle">
      <rect x="45" y="319" width="225" height="76" rx="13" fill="#f2edff" stroke="#b6a3f4"/><text x="157" y="349" font-size="15" font-weight="650" fill="#25212d">Committed prompt</text><text x="157" y="375" font-size="13" fill="#655f6d">… headquartered in</text>
      <rect x="325" y="319" width="150" height="76" rx="13" fill="#eaf2ff" stroke="#8eb3eb"/><text x="400" y="350" font-size="15" font-weight="650" fill="#294563">Austin</text><text x="400" y="374" font-size="12" fill="#526273">target correction</text>
      <rect x="555" y="305" width="250" height="104" rx="14" fill="#f3f3f5" stroke="#b8b6bd" stroke-dasharray="6 5"/><text x="680" y="340" font-size="15" font-weight="650" fill="#77717d">Discard stale suffix</text><text x="680" y="366" font-size="14" fill="#77717d">Clara → , → California</text><text x="680" y="389" font-size="12" fill="#77717d">drafted after “Santa”</text>
      <rect x="885" y="319" width="270" height="76" rx="13" fill="#eaf8f0" stroke="#72bd93"/><text x="1020" y="349" font-size="15" font-weight="650" fill="#27543b">Draft a fresh K tokens</text><text x="1020" y="375" font-size="13" fill="#527060">starting after “Austin”</text>
    </g>
    <g fill="none" stroke="#625b75" stroke-width="2" marker-end="url(#a)"><path d="M270 357h55"/><path d="M475 357h80"/><path d="M805 357h80"/></g>
    <path d="M1020 395v75c0 48-42 72-88 72H154c-58 0-89-30-89-72V395" fill="none" stroke="#6e56cf" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
    <text x="600" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#6e56cf">REPEAT UNTIL GENERATION ENDS</text>
    <rect x="285" y="555" width="630" height="36" rx="18" fill="#eaf8f0" stroke="#72bd93"/><text x="600" y="579" text-anchor="middle" font-size="14" font-weight="650" fill="#27543b">If all K draft tokens pass, the target also emits one already-computed bonus token.</text>
  </g>
</svg>
