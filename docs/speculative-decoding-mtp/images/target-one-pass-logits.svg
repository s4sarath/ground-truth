<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">One target pass aligns logits with four draft tokens and one bonus position</title>
  <desc id="desc">Prompt tokens and four draft tokens are input together. The target output after in verifies Santa, after Santa verifies Clara, after Clara verifies comma, after comma verifies California, and after California provides a bonus-token distribution.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#625b75"/></marker></defs>
  <rect x="1" y="1" width="1198" height="598" rx="22" fill="#fffaf8" stroke="#cbbaff" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
    <text x="600" y="48" text-anchor="middle" font-size="27" font-weight="650" fill="#1d1d1f">Prompt + draft go through the target together</text>
    <text x="600" y="78" text-anchor="middle" font-size="16" fill="#6e6e73">Causal masking keeps each output aligned with the next candidate position.</text>
    <text x="45" y="124" font-size="13" font-weight="700" fill="#6e56cf">ONE INPUT SEQUENCE</text>
    <g text-anchor="middle" font-size="14" font-weight="600">
      <g fill="#f2edff" stroke="#b6a3f4"><rect x="45" y="145" width="120" height="55" rx="10"/><rect x="173" y="145" width="75" height="55" rx="10"/><rect x="256" y="145" width="185" height="55" rx="10"/><rect x="449" y="145" width="65" height="55" rx="10"/></g>
      <text x="105" y="179" fill="#25212d">NVIDIA</text><text x="210" y="179" fill="#25212d">is</text><text x="348" y="179" fill="#25212d">headquartered</text><text x="481" y="179" fill="#25212d">in</text>
      <g fill="#eaf8f0" stroke="#72bd93"><rect x="550" y="145" width="115" height="55" rx="10"/><rect x="673" y="145" width="110" height="55" rx="10"/><rect x="791" y="145" width="70" height="55" rx="10"/><rect x="869" y="145" width="145" height="55" rx="10"/></g>
      <text x="607" y="179" fill="#27543b">Santa</text><text x="728" y="179" fill="#27543b">Clara</text><text x="826" y="179" fill="#27543b">,</text><text x="941" y="179" fill="#27543b">California</text>
    </g>
    <path d="M45 236h969" stroke="#625b75" stroke-width="2" marker-end="url(#a)"/>
    <rect x="250" y="256" width="700" height="86" rx="17" fill="#eaf2ff" stroke="#8eb3eb" stroke-width="2"/><text x="600" y="292" text-anchor="middle" font-size="19" font-weight="650" fill="#25212d">Gemma target · one forward pass</text><text x="600" y="318" text-anchor="middle" font-size="14" fill="#526273">produces a vocabulary-wide probability distribution at every position</text>
    <text x="45" y="392" font-size="13" font-weight="700" fill="#6e56cf">ALIGNED OUTPUT DISTRIBUTIONS</text>
    <g text-anchor="middle">
      <g fill="#faf9ff" stroke="#b6a3f4"><rect x="45" y="416" width="190" height="82" rx="13"/><rect x="265" y="416" width="190" height="82" rx="13"/><rect x="485" y="416" width="190" height="82" rx="13"/><rect x="705" y="416" width="190" height="82" rx="13"/><rect x="925" y="416" width="230" height="82" rx="13"/></g>
      <g font-size="14" font-weight="650" fill="#25212d"><text x="140" y="449">after “in”</text><text x="360" y="449">after “Santa”</text><text x="580" y="449">after “Clara”</text><text x="800" y="449">after “,”</text><text x="1040" y="449">after “California”</text></g>
      <g font-size="13" fill="#655f6d"><text x="140" y="476">verify Santa</text><text x="360" y="476">verify Clara</text><text x="580" y="476">verify comma</text><text x="800" y="476">verify California</text><text x="1040" y="476">bonus-token distribution</text></g>
    </g>
    <g fill="none" stroke="#625b75" stroke-width="1.7" marker-end="url(#a)"><path d="M420 342v40H140v34"/><path d="M510 342v53h-150v21"/><path d="M600 342v74"/><path d="M690 342v53h110v21"/><path d="M780 342v40h260v34"/></g>
    <text x="600" y="555" text-anchor="middle" font-size="14" fill="#6e6e73">Known candidates create parallel verification work; the target still determines every committed token.</text>
  </g>
</svg>
