<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Standard decoding advances one token per target-model time step</title>
  <desc id="desc">Starting with NVIDIA is headquartered in, five successive target-model calls generate Santa, Clara, a comma, California, and a period. Each call reads the large model weights again.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#625b75"/></marker></defs>
  <rect x="1" y="1" width="1198" height="568" rx="22" fill="#fffaf8" stroke="#cbbaff" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
    <text x="600" y="48" text-anchor="middle" font-size="27" font-weight="650" fill="#1d1d1f">Standard decoding: five tokens, five target steps</text>
    <text x="600" y="78" text-anchor="middle" font-size="16" fill="#6e6e73">Every chosen token becomes context before the next target-model call can begin.</text>
    <rect x="45" y="112" width="1110" height="68" rx="13" fill="#f2edff" stroke="#b6a3f4"/>
    <text x="75" y="140" font-size="13" font-weight="700" fill="#6e56cf">INPUT PROMPT</text>
    <text x="75" y="165" font-size="18" font-weight="600" fill="#25212d">NVIDIA is headquartered in</text>
    <g text-anchor="middle">
      <text x="140" y="224" font-size="13" font-weight="700" fill="#6e56cf">t1</text><text x="370" y="224" font-size="13" font-weight="700" fill="#6e56cf">t2</text><text x="600" y="224" font-size="13" font-weight="700" fill="#6e56cf">t3</text><text x="830" y="224" font-size="13" font-weight="700" fill="#6e56cf">t4</text><text x="1060" y="224" font-size="13" font-weight="700" fill="#6e56cf">t5</text>
      <g fill="#eaf2ff" stroke="#8eb3eb" stroke-width="1.5">
        <rect x="55" y="244" width="170" height="90" rx="14"/><rect x="285" y="244" width="170" height="90" rx="14"/><rect x="515" y="244" width="170" height="90" rx="14"/><rect x="745" y="244" width="170" height="90" rx="14"/><rect x="975" y="244" width="170" height="90" rx="14"/>
      </g>
      <g fill="#25212d"><text x="140" y="279" font-size="17" font-weight="650">Target model</text><text x="370" y="279" font-size="17" font-weight="650">Target model</text><text x="600" y="279" font-size="17" font-weight="650">Target model</text><text x="830" y="279" font-size="17" font-weight="650">Target model</text><text x="1060" y="279" font-size="17" font-weight="650">Target model</text></g>
      <g fill="#5e6874" font-size="13"><text x="140" y="304">read weights</text><text x="370" y="304">read weights</text><text x="600" y="304">read weights</text><text x="830" y="304">read weights</text><text x="1060" y="304">read weights</text></g>
      <g fill="#eaf8f0" stroke="#72bd93"><rect x="75" y="389" width="130" height="55" rx="11"/><rect x="305" y="389" width="130" height="55" rx="11"/><rect x="535" y="389" width="130" height="55" rx="11"/><rect x="765" y="389" width="130" height="55" rx="11"/><rect x="995" y="389" width="130" height="55" rx="11"/></g>
      <g font-size="17" font-weight="650" fill="#27543b"><text x="140" y="423">Santa</text><text x="370" y="423">Clara</text><text x="600" y="423">,</text><text x="830" y="423">California</text><text x="1060" y="423">.</text></g>
    </g>
    <g fill="none" stroke="#625b75" stroke-width="2" marker-end="url(#a)"><path d="M225 289h60"/><path d="M455 289h60"/><path d="M685 289h60"/><path d="M915 289h60"/><path d="M140 334v55"/><path d="M370 334v55"/><path d="M600 334v55"/><path d="M830 334v55"/><path d="M1060 334v55"/></g>
    <text x="600" y="493" text-anchor="middle" font-size="15" font-weight="600" fill="#3f3a48">The KV cache preserves prefix state, but the full stack of model weights still participates at every time step.</text>
    <rect x="330" y="516" width="540" height="32" rx="16" fill="#fff1ec" stroke="#e59b76"/><text x="600" y="537" text-anchor="middle" font-size="14" font-weight="650" fill="#773e2d">Serial dependency + repeated weight movement = decode latency</text>
  </g>
</svg>
